name: Build Check

# Makes sure every push still analyzes and builds, before anyone tags a
# release. Uses a placeholder .env and the debug signing key; nothing is
# published.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  android:
    name: Analyze and build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Placeholder .env
        run: printf 'SUPABASE_URL=https://example.supabase.co\nSUPABASE_ANON_KEY=placeholder\n' > .env

      - run: flutter pub get

      - name: Analyze (errors only)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib

      - name: Build release APK (debug-signed)
        run: flutter build apk --release

  windows:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Placeholder .env
        shell: bash
        run: printf 'SUPABASE_URL=https://example.supabase.co\nSUPABASE_ANON_KEY=placeholder\n' > .env

      - run: flutter pub get

      - run: flutter build windows --release
